name: Predev CI

on:
  push:
    branches:
      - predev
  workflow_dispatch:

permissions:
  contents: read

# MOB-028A: predev builds carry an explicit predev release identity.
env:
  MIRA_RELEASE_CHANNEL: predev

concurrency:
  group: predev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

  android:
    name: Android predev builds
    needs:
      - quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/uichat-mira-mobile-dev.apk

      - name: Prepare release signing
        env:
          MIRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.MIRA_RELEASE_KEYSTORE_BASE64 }}
          MIRA_RELEASE_STORE_PASSWORD: ${{ secrets.MIRA_RELEASE_STORE_PASSWORD }}
          MIRA_RELEASE_KEY_ALIAS: ${{ secrets.MIRA_RELEASE_KEY_ALIAS }}
          MIRA_RELEASE_KEY_PASSWORD: ${{ secrets.MIRA_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$MIRA_RELEASE_KEYSTORE_BASE64"
          test -n "$MIRA_RELEASE_STORE_PASSWORD"
          test -n "$MIRA_RELEASE_KEY_ALIAS"
          test -n "$MIRA_RELEASE_KEY_PASSWORD"
          printf '%s' "$MIRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mira-release.keystore"

      - name: Build signed release APK
        env:
          MIRA_RELEASE_STORE_FILE: ${{ runner.temp }}/mira-release.keystore
          MIRA_RELEASE_STORE_PASSWORD: ${{ secrets.MIRA_RELEASE_STORE_PASSWORD }}
          MIRA_RELEASE_KEY_ALIAS: ${{ secrets.MIRA_RELEASE_KEY_ALIAS }}
          MIRA_RELEASE_KEY_PASSWORD: ${{ secrets.MIRA_RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            -PreactNativeArchitectures=arm64-v8a \
            assembleRelease \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            --stacktrace

      - name: Verify release APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          entries="$RUNNER_TEMP/release-apk-entries.txt"
          test -f "$apk"
          unzip -tq "$apk"
          unzip -Z1 "$apk" > "$entries"
          grep -Fxq 'assets/index.android.bundle' "$entries"
          grep -Fxq 'lib/arm64-v8a/libreact_codegen_rnsvg.so' "$entries"
          bad_abis=$(awk -F/ '$1 == "lib" && $2 != "arm64-v8a" { print $2 }' "$entries" | sort -u)
          if [ -n "$bad_abis" ]; then
            echo "Release APK contains non-arm64 native libraries: $bad_abis" >&2
            exit 1
          fi
          apk_size_bytes=$(stat -c '%s' "$apk")
          apk_size_mib=$(awk -v bytes="$apk_size_bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')
          {
            echo "### Android signed release"
            echo "ABI: arm64-v8a only"
            echo "APK size: ${apk_size_mib} MiB (${apk_size_bytes} bytes)"
          } >> "$GITHUB_STEP_SUMMARY"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          release_dir=android/app/build/outputs/apk/release
          cp "$apk" "$release_dir/uichat-mira-mobile-release.apk"
          cd "$release_dir"
          sha256sum uichat-mira-mobile-release.apk > uichat-mira-mobile-release.apk.sha256

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: uichat-mira-mobile-android-debug
          path: android/app/build/outputs/apk/debug/uichat-mira-mobile-dev.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: uichat-mira-mobile-android-release
          path: |
            android/app/build/outputs/apk/release/uichat-mira-mobile-release.apk
            android/app/build/outputs/apk/release/uichat-mira-mobile-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS simulator and unsigned device builds
    needs:
      - quality
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: bundle exec pod install

      - name: Build iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          derived_data='ios/build/SimulatorDerivedData'
          rm -rf "$derived_data"

          # Keep the installed bundle version identical to the version the
          # About screen compares against (package.json), so iOS update checks
          # reason about the real installed version.
          package_version=$(node -p "require('./package.json').version")
          test -n "$package_version"

          xcodebuild \
            -workspace ios/UIChatMira.xcworkspace \
            -scheme UIChatMira \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived_data" \
            MARKETING_VERSION="$package_version" \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path=$(find "$derived_data/Build/Products" -type d -name '*.app' -print -quit)
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" ios/build/uichat-mira-mobile-ios-simulator.zip

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          derived_data='ios/build/UnsignedDeviceDerivedData'
          rm -rf "$derived_data"
          package_version=$(node -p "require('./package.json').version")
          test -n "$package_version"
          xcodebuild \
            -workspace ios/UIChatMira.xcworkspace \
            -scheme UIChatMira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived_data" \
            MARKETING_VERSION="$package_version" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          derived_data='ios/build/UnsignedDeviceDerivedData'
          products_dir="$derived_data/Build/Products/Release-iphoneos"
          app_path=$(find "$products_dir" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app_path"
          test -f "$app_path/Info.plist"
          test -f "$app_path/main.jsbundle"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")
          test -n "$executable"
          test -f "$app_path/$executable"
          archs=$(lipo -archs "$app_path/$executable")
          printf '%s\n' "$archs" | tr ' ' '\n' | grep -Fxq arm64
          package_dir='ios/build/unsigned-device-package'
          ipa='ios/build/uichat-mira-mobile-ios-unsigned-device.ipa'
          checksum="$ipa.sha256"
          rm -rf "$package_dir" "$ipa" "$checksum"
          mkdir -p "$package_dir/Payload"
          ditto "$app_path" "$package_dir/Payload/$(basename "$app_path")"
          (
            cd "$package_dir"
            ditto -c -k --sequesterRsrc --keepParent Payload "../$(basename "$ipa")"
          )
          unzip -tq "$ipa"
          entries="$RUNNER_TEMP/ios-unsigned-device-entries.txt"
          unzip -Z1 "$ipa" > "$entries"
          grep -Eq '^Payload/[^/]+\.app/Info\.plist$' "$entries"
          grep -Eq '^Payload/[^/]+\.app/main.jsbundle$' "$entries"
          if grep -Eq '^Payload/[^/]+\.app/embedded\.mobileprovision$' "$entries"; then
            echo 'Unsigned IPA unexpectedly contains an embedded provisioning profile.' >&2
            exit 1
          fi
          (
            cd "$(dirname "$ipa")"
            shasum -a 256 "$(basename "$ipa")" > "$(basename "$checksum")"
          )

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: uichat-mira-mobile-ios-simulator
          path: ios/build/uichat-mira-mobile-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@v4
        with:
          name: uichat-mira-mobile-ios-unsigned-device
          path: |
            ios/build/uichat-mira-mobile-ios-unsigned-device.ipa
            ios/build/uichat-mira-mobile-ios-unsigned-device.ipa.sha256
          if-no-files-found: error
          retention-days: 14

  publish-predev-r2:
    name: Publish predev artifacts to R2
    needs:
      - quality
      - android
      - ios
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify asset set and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          required=(
            uichat-mira-mobile-dev.apk
            uichat-mira-mobile-release.apk
            uichat-mira-mobile-release.apk.sha256
            uichat-mira-mobile-ios-simulator.zip
            uichat-mira-mobile-ios-unsigned-device.ipa
            uichat-mira-mobile-ios-unsigned-device.ipa.sha256
          )
          for name in "${required[@]}"; do
            test -s "release-assets/$name"
          done
          (
            cd release-assets
            sha256sum -c uichat-mira-mobile-release.apk.sha256
            sha256sum -c uichat-mira-mobile-ios-unsigned-device.ipa.sha256
            unzip -tq uichat-mira-mobile-ios-simulator.zip
            unzip -tq uichat-mira-mobile-ios-unsigned-device.ipa
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload predev artifacts to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: 5
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET R2_PUBLIC_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret is missing: ${name}" >&2
              exit 1
            fi
          done

          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          latest_prefix="mira/mobile/predev/latest"

          upload() {
            aws s3 sync release-assets/ "s3://${R2_BUCKET}/${latest_prefix}/" \
              --endpoint-url "$endpoint" \
              --cache-control 'public, max-age=300, must-revalidate' \
              --only-show-errors
          }

          verify_remote() {
            while IFS= read -r -d '' file; do
              filename=$(basename "$file")
              key="${latest_prefix}/${filename}"
              local_size=$(stat -c '%s' "$file")
              remote_size=$(aws s3api head-object \
                --bucket "$R2_BUCKET" \
                --key "$key" \
                --endpoint-url "$endpoint" \
                --query ContentLength \
                --output text)
              test "$local_size" = "$remote_size"
            done < <(find release-assets -maxdepth 1 -type f -print0)
          }

          published=false
          for attempt in 1 2 3; do
            if upload && verify_remote; then
              published=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done

          if [ "$published" != true ]; then
            echo 'Predev R2 publication failed after 3 attempts.' >&2
            exit 1
          fi

          public_base="${R2_PUBLIC_BASE_URL%/}"
          {
            echo "### Cloudflare R2"
            echo "Predev: ${public_base}/${latest_prefix}/"
            echo "Android: ${public_base}/${latest_prefix}/uichat-mira-mobile-release.apk"
            echo "iOS unsigned IPA: ${public_base}/${latest_prefix}/uichat-mira-mobile-ios-unsigned-device.ipa"
          } >> "$GITHUB_STEP_SUMMARY"
