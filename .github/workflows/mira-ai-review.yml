name: Mira Organization AI Review

on:
  pull_request_target:
    branches:
      - dev
      - test
      - prod
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  contents: read

concurrency:
  group: mira-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_REVIEW_GATEWAY_TOKEN: ${{ secrets.AI_REVIEW_GATEWAY_TOKEN }}
      AI_REVIEW_GATEWAY_URL: https://uichat-mira-control-room.dangjingtao.workers.dev/api/v1/ai-review/publish
    steps:
      - name: Validate trusted review transition
        id: target
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pr = event.pull_request;
          if (!pr) throw new Error('pull_request_target event is missing pull_request payload');

          const allowed =
            (pr.base.ref === 'dev' && pr.head.ref.startsWith('feat/')) ||
            (pr.base.ref === 'test' && pr.head.ref === 'dev') ||
            (pr.base.ref === 'prod' && pr.head.ref === 'test');

          console.log(`eligible=${allowed ? 'true' : 'false'}`);
          console.log(`repository=${pr.base.repo.full_name}`);
          console.log(`pull_request=${pr.number}`);
          NODE

      - name: Publish Mira review
        if: steps.target.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AI_REVIEW_GATEWAY_TOKEN:-}"

          node <<'NODE' > /tmp/mira-review-request.json
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          process.stdout.write(JSON.stringify({
            repository: event.pull_request.base.repo.full_name,
            pullRequest: event.pull_request.number,
          }));
          NODE

          status="$(
            curl --silent --show-error \
              --max-time 180 \
              -X POST \
              -H "Authorization: Bearer ${AI_REVIEW_GATEWAY_TOKEN}" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data @/tmp/mira-review-request.json \
              --output /tmp/mira-review-response.json \
              --write-out '%{http_code}' \
              "${AI_REVIEW_GATEWAY_URL}"
          )"

          HTTP_STATUS="$status" node <<'NODE'
          const fs = require('node:fs');
          const status = Number(process.env.HTTP_STATUS);
          const body = JSON.parse(fs.readFileSync('/tmp/mira-review-response.json', 'utf8'));
          const publicationState = body.publication?.state;
          const publicationSucceeded = publicationState === 'CREATED' || publicationState === 'UPDATED';

          const completed =
            status === 200 &&
            body.execution?.state === 'COMPLETED' &&
            body.freshness?.state === 'CURRENT' &&
            publicationSucceeded;
          const stale =
            status === 409 &&
            body.freshness?.state === 'STALE_REVIEW' &&
            publicationSucceeded;
          const unavailable =
            status === 503 &&
            body.execution?.state === 'REVIEW_UNAVAILABLE' &&
            publicationSucceeded;

          const state = completed
            ? `COMPLETED:${body.execution.review?.verdict ?? 'UNKNOWN'}`
            : stale
              ? 'STALE_REVIEW'
              : unavailable
                ? `REVIEW_UNAVAILABLE:${body.execution.reason ?? 'unknown'}`
                : `FAILED:HTTP_${status}`;
          console.log(`Mira AI Review: ${state}`);

          if (!completed && !stale && !unavailable) {
            const safeError = typeof body.error === 'string' ? body.error : 'unexpected_response';
            console.error(`Mira AI Review caller failed: ${safeError}`);
            process.exit(1);
          }
          NODE

          rm -f /tmp/mira-review-request.json /tmp/mira-review-response.json

      - name: Skip unsupported transition
        if: steps.target.outputs.eligible != 'true'
        shell: bash
        run: echo 'This pull request transition is outside the Mira Organization AI Review modes.'
