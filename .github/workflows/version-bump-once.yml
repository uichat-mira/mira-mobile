name: One-off version bump

on:
  push:
    branches:
      - feat/122-conversation-share

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/122-conversation-share
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0

      - name: Synchronize app version
        shell: bash
        run: |
          set -euo pipefail

          npm version 0.3.5 --no-git-tag-version

          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          old = 'versionCode 7'
          if old not in text:
              raise SystemExit('Expected Android versionCode 7 was not found')
          gradle.write_text(text.replace(old, 'versionCode 8', 1))

          plist = Path('ios/UIChatMira/Info.plist')
          text = plist.read_text()
          old_version = '<key>CFBundleShortVersionString</key>\n\t<string>0.3.0</string>'
          old_build = '<key>CFBundleVersion</key>\n\t<string>7</string>'
          if old_version not in text or old_build not in text:
              raise SystemExit('Expected iOS Info.plist version/build was not found')
          text = text.replace(old_version, '<key>CFBundleShortVersionString</key>\n\t<string>0.3.5</string>', 1)
          text = text.replace(old_build, '<key>CFBundleVersion</key>\n\t<string>8</string>', 1)
          plist.write_text(text)

          pbx = Path('ios/UIChatMira.xcodeproj/project.pbxproj')
          text = pbx.read_text()
          if text.count('CURRENT_PROJECT_VERSION = 1;') != 2:
              raise SystemExit('Expected two iOS CURRENT_PROJECT_VERSION = 1 entries')
          if text.count('MARKETING_VERSION = 1.0;') != 2:
              raise SystemExit('Expected two iOS MARKETING_VERSION = 1.0 entries')
          text = text.replace('CURRENT_PROJECT_VERSION = 1;', 'CURRENT_PROJECT_VERSION = 8;')
          text = text.replace('MARKETING_VERSION = 1.0;', 'MARKETING_VERSION = 0.3.5;')
          pbx.write_text(text)
          PY

          test "$(node -p "require('./package.json').version")" = '0.3.5'
          test "$(node -p "require('./package-lock.json').version")" = '0.3.5'
          test "$(node -p "require('./package-lock.json').packages[''].version")" = '0.3.5'
          git diff --check

      - name: Commit synchronized version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json android/app/build.gradle ios/UIChatMira/Info.plist ios/UIChatMira.xcodeproj/project.pbxproj
          if git diff --cached --quiet; then
            echo 'Version is already synchronized.'
            exit 0
          fi
          git commit -m 'chore(release): bump mobile version to 0.3.5'
          git push origin HEAD:feat/122-conversation-share
